name: Quality and migration baseline

on:
  pull_request:
    paths:
      - 'payload-office-platform/**'
      - '.github/workflows/quality.yml'
  # master 直推也跑质量闸门。此前只在 PR 触发，导致 2026-08-13~08-15 期间三个缺陷
  # 同时潜伏两周无人发现（种子迁移打不到空库、multi-city-forms 无条件读 .env.local、
  # 一批 e2e 用例失败积压）——它们都只在 PR 上才会暴露，而那段时间没有 PR。
  push:
    branches: [master]
    paths:
      - 'payload-office-platform/**'
      - '.github/workflows/quality.yml'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: payload-office-platform
    env:
      PAYLOAD_SECRET: ci-only-payload-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: payload-office-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: payload-office-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate Payload types & importmap
        # payload-types.ts 被 gitignore，CI 里不存在；typecheck/build 前必须先生成
        #（与 Dockerfile 一致）。generate:types 只读 payload.config、不连库。
        run: pnpm generate:types && pnpm payload generate:importmap
      - run: pnpm typecheck
      # deploy.yml 的 quality 作业跑 lint，而本闸门此前不跑 —— 于是 lint 错误在 PR 上
      # 完全隐身，直到合入 master 才让部署卡在 Lint 步（真实教训：#43 合并后
      # 三个 react-hooks/set-state-in-effect 错误挡住部署，PR 三闸门却全绿）。
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm migrate:dry-run
      - name: Build
        run: pnpm build
        env:
          # 仅 build 需要：生产构建收集 /sitemap.xml page data 时前端 site-config
          # fail-closed 需此值（与 deploy.yml 一致）。本作业不连库；DB 相关校验
          #（迁移 / seed / verify / baseline / 全量 E2E）由 postgres-migrations 与 e2e 作业在 PG 上覆盖。
          NEXT_PUBLIC_SITE_URL: https://sbh-286300-10-1253925058.sh.run.tcloudbase.com

  # 全链路 E2E：用生产 server（next build + next start）跑 Playwright，消除 next dev
  # 逐路由 JIT 编译慢导致的导航 10s poll 超时。next start 触发生产 fail-closed 守卫，
  # 故配 PostgreSQL service + 强密钥 + 合法 https 站点 URL（三者见下方 env 注释）。
  e2e:
    runs-on: ubuntu-latest
    # 165 个用例串行（workers:1），CI 下每个失败用例重试 2 次 ×60s ≈ 3 分钟。
    # 坏掉的套件会一路空烧到 GitHub 默认的 360 分钟（2026-08-15 实测单次跑了 47 分钟仍未结束）。
    # 30 分钟足够一次健康的全量运行，失败则快速止损。
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_m0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_m0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: payload-office-platform
    env:
      # next start（NODE_ENV=production）首个请求触发 lib/runtime/config-guard 的
      # assertProductionConfig：缺 PG 连接串 / 弱或短密钥 / 非法站点 URL 任一即拒启动。
      # ① PostgreSQL 连接串（禁止降级 SQLite）
      DATABASE_URL: postgres://payload:payload@127.0.0.1:5432/payload_m0
      # ② 强密钥：非弱默认值且 ≥32 字符（仅 CI，勿用于生产）
      PAYLOAD_SECRET: ci-e2e-payload-secret-do-not-use-in-prod-0123456789
      # ③ 合法 https 非 localhost 站点 URL；同时 build 期注入 sitemap/canonical。
      #    Playwright 的 baseURL 已与之解耦（playwright.config 用 PLAYWRIGHT_BASE_URL /
      #    localhost:PORT），故这里设线上 URL 不会把 E2E 打到线上。
      NEXT_PUBLIC_SITE_URL: https://sbh-286300-10-1253925058.sh.run.tcloudbase.com
      # 本地 server 端口 + 让 playwright.config 的 webServer 切到 next start 生产 server
      PORT: '3717'
      E2E_PROD_SERVER: '1'
      # 地图降级用例（detail-location.spec）需 mapEnabled=true 才渲染"查看地图"按钮，
      # 而 mapEnabled = coordinates != null && NEXT_PUBLIC_AMAP_JS_KEY。此 public key 在
      # next build 期内联入前端 bundle。用例点击后 abort webapi.amap.com 断言降级，真实
      # 请求永不发出，故此处用占位假 key（域名白名单 key，非机密，勿用于生产）。
      NEXT_PUBLIC_AMAP_JS_KEY: e2e-fake-amap-js-key-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: payload-office-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: payload-office-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate Payload types & importmap
        # payload-types.ts 被 gitignore；typecheck/build 前必须先生成（与 Dockerfile 一致）。
        run: pnpm generate:types && pnpm payload generate:importmap
      - run: pnpm exec playwright install --with-deps chromium
      - name: Apply migrations to fresh PostgreSQL
        run: pnpm exec payload migrate
      - name: Seed business data
        run: pnpm seed
      - name: Seed media（gallery ≥3，否则有效供给精筛 §6 排除全部房源 → 前台 0 套）
        # CI 走 sharp 本地合成占位图（seed-media 里 OFFLINE 分支），不依赖外网 picsum。
        run: pnpm seed:media
      - name: Build production bundle
        run: pnpm build
      - name: Run E2E against next start (production server)
        # playwright.config 的 webServer 自动拉起 `next start -p 3717`（E2E_PROD_SERVER=1）。
        # 本步不设 MULTI_CITY_ROUTING_ENABLED，与当前生产形态一致（多城市路由关闭）。
        # 依赖开启态的用例会 test.skip 跳过，由下一步覆盖。
        run: pnpm test:e2e

      - name: Run multi-city E2E (routing enabled)
        # 多城市能力短期不在生产开启，但要保持随时可测：复用同一份构建产物与同一个库，
        # 仅以 MULTI_CITY_ROUTING_ENABLED=true 重启 server 跑多城市那三个 spec。
        # 该 flag 由服务端运行时读取（site-config.ts 的 getMultiCityRoutingEnabled，非
        # NEXT_PUBLIC_），不参与 next build 内联，所以无需重新构建。
        env:
          MULTI_CITY_ROUTING_ENABLED: 'true'
        run: pnpm exec playwright test tests/e2e/multi-city-routing.spec.ts tests/e2e/multi-city-isolation.spec.ts tests/e2e/multi-city-forms.spec.ts

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_m0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_m0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: payload-office-platform
    env:
      PAYLOAD_SECRET: ci-only-payload-secret
      DATABASE_URL: postgres://payload:payload@127.0.0.1:5432/payload_m0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: payload-office-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: payload-office-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate migration source before writes
        run: pnpm migrate:dry-run
      - name: Apply all migrations to a fresh PostgreSQL database
        run: pnpm exec payload migrate
      - name: Verify fresh database
        run: pnpm migrate:verify
      - name: Populate existing business data
        run: pnpm seed
      - name: Re-run migrations against populated database
        run: pnpm exec payload migrate
      - name: Verify populated database after upgrade pass
        run: pnpm migrate:verify
      - name: Capture sanitized PostgreSQL baseline
        run: pnpm baseline:capture

name: Quality and migration baseline

on:
  # paths 里的 '!' 负向模式在后覆盖前：纯文档改动（CLAUDE.md / AGENTS.md / .agent/*.md）
  # 不再触发整套闸门。它们进不了运行时产物，却曾让一行 markdown 烧掉 ~14 分钟额度。
  pull_request:
    paths:
      - 'payload-office-platform/**'
      - '!payload-office-platform/**/*.md'
      - '.github/workflows/quality.yml'
      # deploy.yml 改动也要跑本工作流：production-deploy-config.test.ts 对它下了断言
      # （流量门、构建失败判定、触发方式），只改 deploy.yml 时这些断言必须有机会跑。
      - '.github/workflows/deploy.yml'
  # master 直推也跑质量闸门。此前只在 PR 触发，导致 2026-08-13~08-15 期间三个缺陷
  # 同时潜伏两周无人发现（种子迁移打不到空库、multi-city-forms 无条件读 .env.local、
  # 一批 e2e 用例失败积压）——它们都只在 PR 上才会暴露，而那段时间没有 PR。
  push:
    branches: [master]
    paths:
      - 'payload-office-platform/**'
      - '!payload-office-platform/**/*.md'
      - '.github/workflows/quality.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: payload-office-platform
    env:
      PAYLOAD_SECRET: ci-only-payload-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: payload-office-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: payload-office-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate Payload types & importmap
        # payload-types.ts 被 gitignore，CI 里不存在；typecheck/build 前必须先生成
        #（与 Dockerfile 一致）。generate:types 只读 payload.config、不连库。
        run: pnpm generate:types && pnpm payload generate:importmap
      - run: pnpm typecheck
      # deploy.yml 的 quality 作业跑 lint，而本闸门此前不跑 —— 于是 lint 错误在 PR 上
      # 完全隐身，直到合入 master 才让部署卡在 Lint 步（真实教训：#43 合并后
      # 三个 react-hooks/set-state-in-effect 错误挡住部署，PR 三闸门却全绿）。
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm migrate:dry-run
      - name: 迁移预检（目录与索引一致性 + 危险项扫描）
        # 从 deploy.yml 的质量门搬来：该门已删（与本工作流重复），但这条检查此前
        # 只在这里有，不搬会静默丢失。绕过 npm script 的 --env-file=.env.local
        #（CI 无该文件）；migrations 子命令纯扫描文件，不读 env。
        run: pnpm exec tsx scripts/preflight.ts migrations
      # 本作业不再跑 build：同一个 commit 的 `next build` 已由下面的 e2e 作业跑过
      #（它必须构建才能起 next start），两处并行各跑一次纯属重复烧额度（各约 80s）。
      # 构建失败依然会红——由 e2e 作业报出，而 deploy.yml 依赖本工作流整体成功。

  # 全链路 E2E：用生产 server（next build + next start）跑 Playwright，消除 next dev
  # 逐路由 JIT 编译慢导致的导航 10s poll 超时。next start 触发生产 fail-closed 守卫，
  # 故配 PostgreSQL service + 强密钥 + 合法 https 站点 URL（三者见下方 env 注释）。
  e2e:
    runs-on: ubuntu-latest
    # 165 个用例串行（workers:1），CI 下每个失败用例重试 2 次 ×60s ≈ 3 分钟。
    # 坏掉的套件会一路空烧到 GitHub 默认的 360 分钟（2026-08-15 实测单次跑了 47 分钟仍未结束）。
    # 健康的全量运行实测约 6m40s（含构建与 seed），15 分钟留足两倍余量，
    # 同时把坏套件的空烧封顶砍半——私有仓库的分钟数是真金白银。
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_m0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_m0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: payload-office-platform
    env:
      # next start（NODE_ENV=production）首个请求触发 lib/runtime/config-guard 的
      # assertProductionConfig：缺 PG 连接串 / 弱或短密钥 / 非法站点 URL 任一即拒启动。
      # ① PostgreSQL 连接串（禁止降级 SQLite）
      DATABASE_URL: postgres://payload:payload@127.0.0.1:5432/payload_m0
      # ② 强密钥：非弱默认值且 ≥32 字符（仅 CI，勿用于生产）
      PAYLOAD_SECRET: ci-e2e-payload-secret-do-not-use-in-prod-0123456789
      # ③ 合法 https 非 localhost 站点 URL；同时 build 期注入 sitemap/canonical。
      #    Playwright 的 baseURL 已与之解耦（playwright.config 用 PLAYWRIGHT_BASE_URL /
      #    localhost:PORT），故这里设线上 URL 不会把 E2E 打到线上。
      NEXT_PUBLIC_SITE_URL: https://sbh-286300-10-1253925058.sh.run.tcloudbase.com
      # 本地 server 端口 + 让 playwright.config 的 webServer 切到 next start 生产 server
      PORT: '3717'
      E2E_PROD_SERVER: '1'
      # 地图降级用例（detail-location.spec）需 mapEnabled=true 才渲染"查看地图"按钮，
      # 而 mapEnabled = coordinates != null && NEXT_PUBLIC_AMAP_JS_KEY。此 public key 在
      # next build 期内联入前端 bundle。用例点击后 abort webapi.amap.com 断言降级，真实
      # 请求永不发出，故此处用占位假 key（域名白名单 key，非机密，勿用于生产）。
      NEXT_PUBLIC_AMAP_JS_KEY: e2e-fake-amap-js-key-not-real
      # OPT-064 埋点：E2E 必须跑在**生产构建**上才验得到 Umami 接线——
      # 开发环境的 adapter 是 ConsoleAdapter，事件根本到不了 window.umami，
      # 在 dev 下打桩什么也观测不到（用例要么失败，要么退化成与接线无关的断言）。
      # 这三个 NEXT_PUBLIC_* 是构建期内联的，所以必须在 job 级 env 里给足，
      # next build 才会把 UmamiAdapter 那条分支编进 bundle。
      # SRC 指向一个不可达域名：真实脚本加载失败不影响断言，
      # 用例侧用 page.addInitScript 在导航前就把 window.umami 桩装好了。
      NEXT_PUBLIC_ANALYTICS_ENABLED: 'true'
      NEXT_PUBLIC_UMAMI_SRC: https://umami-e2e.invalid
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: e2e-fake-website-id
      # 出售频道：不再有功能开关（OPT-057 起常开），这里**刻意不设任何相关变量**。
      #
      # 沿革：曾有 NEXT_PUBLIC_SALE_CHANNEL_ENABLED，CI 必须跟着 Dockerfile 一起开，
      # 否则 e2e 验的是「频道关闭」那条路径，而线上是开着的——两边跑的不是同一个形态。
      # 开关拆掉后这条约束消失：CI 无变量即等同线上形态，sale-channel.spec 的
      # /sale 与 /[city]/sale 断言此时验的正是真实链路。
      #
      # 若将来 e2e 出售用例红了，**不要**去加回这个变量——它已不被任何代码读取
      # （tests/sale-channel-always-on.test.ts 会拦住回流），红灯是真回归。
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: payload-office-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: payload-office-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate Payload types & importmap
        # payload-types.ts 被 gitignore；typecheck/build 前必须先生成（与 Dockerfile 一致）。
        run: pnpm generate:types && pnpm payload generate:importmap
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('payload-office-platform/pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Apply migrations to fresh PostgreSQL
        run: pnpm exec payload migrate
      - name: Seed business data
        run: pnpm seed
      - name: Seed media（gallery ≥3，否则完整度校验拦截自动发布，房源停在草稿态 → 前台 0 套；§6 媒体数量已于 2026-08-19 从有效供给精筛移除，不再是可见性条件）
        # CI 走 sharp 本地合成占位图（seed-media 里 OFFLINE 分支），不依赖外网 picsum。
        run: pnpm seed:media
      - name: Build production bundle
        run: pnpm build
      - name: Run E2E against next start (production server)
        # playwright.config 的 webServer 自动拉起 `next start -p 3717`（E2E_PROD_SERVER=1）。
        # 本步不设 MULTI_CITY_ROUTING_ENABLED，依赖开启态的用例会 test.skip 跳过，
        # 由下一步覆盖。
        #
        # ⚠️ 原注释写「与当前生产形态一致（多城市路由关闭）」——**已过期**：
        # 2026-08-24 核查生产 EnvParams，MULTI_CITY_ROUTING_ENABLED 是 "true"。
        # 也就是说这一趟跑的形态与生产已经不一致了。改成「主趟跑关闭态」需要
        # 重新评估哪些用例该在哪一趟跑，超出 OPT-045 范围，这里只订正描述、不改行为。
        run: pnpm test:e2e

      - name: Run multi-city E2E (routing enabled)
        # 多城市能力短期不在生产开启，但要保持随时可测：复用同一份构建产物与同一个库，
        # 仅以 MULTI_CITY_ROUTING_ENABLED=true 重启 server 跑多城市那三个 spec。
        # 该 flag 由服务端运行时读取（site-config.ts 的 getMultiCityRoutingEnabled，非
        # NEXT_PUBLIC_），不参与 next build 内联，所以无需重新构建。
        env:
          MULTI_CITY_ROUTING_ENABLED: 'true'
        run: pnpm exec playwright test tests/e2e/multi-city-routing.spec.ts tests/e2e/multi-city-isolation.spec.ts tests/e2e/multi-city-forms.spec.ts tests/e2e/sale-channel.spec.ts

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: payload_m0
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d payload_m0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: payload-office-platform
    env:
      PAYLOAD_SECRET: ci-only-payload-secret
      DATABASE_URL: postgres://payload:payload@127.0.0.1:5432/payload_m0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: payload-office-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: payload-office-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate migration source before writes
        run: pnpm migrate:dry-run
      # OPT-048：快照漂移守卫。migrate:create 比对的是 config vs 最后一份 .json 快照，
      # 从不看真实库；在旧基线上生成迁移会让新快照丢掉旧快照已有的列，而这件事没有
      # 任何现成信号——直到下一个人跑 migrate:create 凭空多出一条重复迁移（且不带
      # IF NOT EXISTS），部署到已有该列的生产库上直接失败。这里让它在 PR 阶段就红。
      - name: Guard against migration snapshot drift
        run: pnpm migrate:drift
      - name: Apply all migrations to a fresh PostgreSQL database
        run: pnpm exec payload migrate
      - name: Verify fresh database
        run: pnpm migrate:verify
      - name: Populate existing business data
        run: pnpm seed
      - name: Re-run migrations against populated database
        run: pnpm exec payload migrate
      - name: Verify populated database after upgrade pass
        run: pnpm migrate:verify
      - name: Capture sanitized PostgreSQL baseline
        run: pnpm baseline:capture

# Git 自动部署 -> CloudBase CloudRun
#
# 触发：push 到 master 且改动 payload-office-platform/ 或本 workflow 文件；
#       也可在 Actions 页面手动触发 (workflow_dispatch)。
#
# 两段式（OPT-016）：
#   quality  - 在 CI runner 上跑 lint/typecheck/test/build/迁移预检，作为发布质量门。
#              失败则 deploy 不跑。产物不传递（deploy 重新 checkout 干净源码）。
#   deploy   - 锁定 @cloudbase/cli@3.6.4；部署新版本（灰度 0% 流量）-> 切 10% 灰度 ->
#              冒烟（/api/health + /）-> 通过则 traffic promote 全量，失败则 traffic rollback。
#
# 机制：CI runner 上 docker build，推镜像到腾讯云 TCR，再用 CloudBase API 提交 image 版本。
#
# 跨境推镜像是这条通道的命门（run 31292071284 / 31290760006 的失败原因）：
#   GitHub 美国 runner -> ccr.ccs.tencentyun.com（上海）链路会静默停滞，buildkit 推 blob
#   时没有停滞检测，连接死掉既不报错也不重试，一路挂到 job timeout 被杀。
#   31292071284 里 build 3分55秒就完事，push 之后 15 分钟零输出直接撞 20 分钟上限。
# 因此这里有三条硬约束，别改回去：
#   1. build 与 push 拆成两步。合在 build-push-action 里时一次卡死 = 整步白费，
#      下次从零再来；拆开后 push 可以独立重试，已传的 blob registry 会跳过，重试是增量的。
#   2. 每次 push 套 `timeout`。没有它，停滞的连接会骑满整个步骤预算。
#   3. 不用 GHA 构建缓存导出（buildx 的 gha cache，mode=max）。它在 31292071284 里花了
#      390 秒（多阶段构建要导出 deps/builder 全部中间层），把 20 分钟预算吃掉三分之一，
#      而 build 本身从零也只要 4 分钟。净负担，不是优化。
#      注：这段措辞刻意避开 YAML 键的字面写法，tests/production-deploy-config.test.ts
#      用 not.toContain 断言它没被加回来，注释里出现字面串会让该断言恒假。
# 不装 buildx（setup-buildx-action 会把默认 builder 切成 docker-container 驱动，产物不落
#   本地镜像库，push 前还得多一次 --load 导出）。裸 docker build 走 daemon 内置 buildkit，
#   `# syntax=` 指令照常生效，镜像直接进本地库供 push。
#
# 根治方向是把构建搬到境内（云托管绑定 GitHub 仓库由平台拉代码构建，或境内 self-hosted
#   runner），跨境只走代码不走镜像。本文件是搬迁前的止血。
#
# 迁移单次执行：容器启动时跑 scripts/migrate-locked.ts（PG advisory lock 互斥 + 幂等），
#       多实例并发拉起只有一个实例真正跑迁移。CI 不单独跑迁移。
#
# 鉴权：腾讯云 CAM 子账号 API 密钥 (SecretId/SecretKey)，tcb login --apiKeyId/--apiKey。
#       子账号需绑定 CAM 策略：
#         - QcloudAccessForTCBRole
#         - QcloudAccessForTCBRoleInAccessCloudBaseRun
#       密钥注入到 GitHub Secrets：TCB_SECRET_ID / TCB_SECRET_KEY / TCB_ENV_ID
#
# 环境变量：发布请求不传 env-vars，继续使用服务级环境变量
#       (DATABASE_URL / PAYLOAD_SECRET / NODE_ENV) 已在控制台/MCP 配好，
#       代码部署只更新版本，不清空服务配置。无需每次重传。
#       首次跑 CI 后建议到控制台核对环境变量仍在。

name: Deploy to CloudBase CloudRun

on:
  push:
    branches: [master]
    paths:
      - 'payload-office-platform/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 部署互相排队，不中途取消（避免并发发布互相覆盖版本）
concurrency:
  group: deploy-sbh
  cancel-in-progress: false

jobs:
  # ---------- 质量门：发布前必须通过 ----------
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # next build 收集 /sitemap.xml page data 时 site-config fail-closed 需此值；
      # 与 Dockerfile 构建阶段 ENV 一致。
      NEXT_PUBLIC_SITE_URL: https://sbh-286300-10-1253925058.sh.run.tcloudbase.com
    defaults:
      run:
        working-directory: payload-office-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.6.1

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Payload types & importmap
        # payload-types.ts 被 gitignore，CI checkout 后不存在；typecheck/build 前必须
        # 先生成（与 Dockerfile 构建阶段一致）。generate:types 只读 payload.config、
        # 不连库，无 DB/secret 也安全。漏掉会让 typecheck 报 TS2307 Cannot find module
        # '@/payload-types'，preflight 失败 -> deploy 不跑 -> 生产滞后。
        run: pnpm generate:types && pnpm payload generate:importmap

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: 迁移预检（目录与索引一致性 + 危险项扫描）
        # 绕过 npm script 的 --env-file=.env.local（CI 无该文件）；
        # migrations 子命令纯扫描文件，不读 env。
        run: pnpm exec tsx scripts/preflight.ts migrations

      - name: Build（质量门：验证能构建通过，产物不上传）
        run: pnpm build

  # ---------- 部署：灰度 -> 冒烟 -> 全量/回滚 ----------
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    # build 20 + push 25 + 部署轮询 20（80×15s）已逼近 60，留出余量避免 job 级超时
    # 抢在步骤级超时前面触发（那样日志停在半空，看不出是哪一步卡的）。
    timeout-minutes: 90
    env:
      # 非交互模式：所有确认提示（telemetry 询问、--force 确认）自动按默认值走。
      # 否则 CI 无 tty，提示库收到 EOF 会以 exit 130 中断。
      CLOUDBASE_CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CloudBase CLI（锁版本，避免 @latest 漂移破坏命令语义）
        run: npm install -g @cloudbase/cli@3.7.0

      - name: tcb login (CAM API key)
        run: tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"

      - name: Login to Tencent Container Registry
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Set image tag
        id: image
        run: |
          set -euo pipefail
          repo="ccr.ccs.tencentyun.com/tcb-100000818451-xfjy/ca-gevmmbac_sbh"
          tag="${GITHUB_SHA::12}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$repo:$tag" >> "$GITHUB_OUTPUT"
          echo "Image: $repo:$tag"

      - name: Build Docker image（只构建，不推送）
        timeout-minutes: 20
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.repo }}:latest
        run: |
          set -euo pipefail
          docker build \
            --file payload-office-platform/Dockerfile \
            --tag "$IMAGE" \
            --tag "$LATEST" \
            payload-office-platform
          # 镜像体积直接决定跨境 push 时长，记进日志便于事后归因。
          docker image inspect "$IMAGE" --format 'Image size: {{.Size}} bytes'

      - name: Push image to Tencent Container Registry（跨境，带超时重试）
        timeout-minutes: 25
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LATEST: ${{ steps.image.outputs.repo }}:latest
        run: |
          set -euo pipefail
          # 单次 push 最多 7 分钟：停滞的跨境连接不会骑满整个步骤预算，超时即掐断换新连接。
          # 重试是增量的——registry 已收下的 blob 会在下次 push 时被跳过，每轮都在推进。
          push_with_retry() {
            local ref="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "== push $ref 尝试 $attempt/5 =="
              if timeout 420 docker push "$ref"; then
                echo "== push $ref 成功（尝试 $attempt）=="
                return 0
              fi
              echo "::warning::push $ref 尝试 $attempt 失败/超时，10s 后重试（已传 blob 会被跳过）"
              sleep 10
            done
            echo "::error::push $ref 5 次全部失败"
            return 1
          }
          push_with_retry "$IMAGE"
          # :latest 与上面同一份镜像，blob 已在 registry，这次只推 manifest，秒级完成。
          push_with_retry "$LATEST"

      - name: Deploy image to CloudBase CloudRun
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          IMAGE_URL: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          before_records="$RUNNER_TEMP/sbh-records-before.json"
          records_info="$RUNNER_TEMP/sbh-records.json"

          records_body=$(jq -cn --arg envId "$TCB_ENV_ID" \
            '{EnvId:$envId,ServerName:"sbh"}')
          tcb api tcbr DescribeCloudRunDeployRecord \
            --api-version 2022-02-17 \
            --json \
            --body "$records_body" |
            sed -n '/^{/,$p' > "$before_records"
          before_deploy_id=$(jq -r '.data.DeployRecords[0].DeployId // empty' "$before_records")

          echo "Deploy image: $IMAGE_URL"
          deploy_info="$RUNNER_TEMP/sbh-image-deploy.json"
          deploy_body=$(jq -cn \
            --arg envId "$TCB_ENV_ID" \
            --arg imageUrl "$IMAGE_URL" \
            '{
              EnvId:$envId,
              ServerName:"sbh",
              DeployInfo:{
                DeployType:"image",
                ImageUrl:$imageUrl,
                ReleaseType:"FULL"
              },
              Items:[
                {Key:"AccessTypes",ArrayValue:["OA","PUBLIC","MINIAPP"]},
                {Key:"Port",IntValue:80}
              ]
            }')
          timeout 60 tcb api tcbr UpdateCloudRunServer \
            --api-version 2022-02-17 \
            --json \
            --body "$deploy_body" |
            sed -n '/^{/,$p' > "$deploy_info"
          jq -e '.data.TaskId | numbers' "$deploy_info" >/dev/null

          ready=0
          for attempt in $(seq 1 80); do
            tcb api tcbr DescribeCloudRunDeployRecord \
              --api-version 2022-02-17 \
              --json \
              --body "$records_body" |
              sed -n '/^{/,$p' > "$records_info"

            deploy_id=$(jq -r '.data.DeployRecords[0].DeployId // empty' "$records_info")
            deploy_status=$(jq -r '.data.DeployRecords[0].Status // empty' "$records_info")
            echo "[$attempt/80] latest deploy $deploy_id -> $deploy_status"

            if [ -z "$deploy_id" ] || [ "$deploy_id" = "$before_deploy_id" ]; then
              sleep 15
              continue
            fi

            case "$deploy_status" in
              normal)
                ready=1
                break
                ;;
              build_failed|deploy_failed)
                echo "::error::Image deploy failed: $deploy_status"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          if [ "$ready" != "1" ]; then
            echo "::error::Timed out waiting for image deploy to become normal"
            exit 1
          fi

      - name: 上传代码包并提交灰度版本（初始 0% 流量）
        if: ${{ false }}
        # 病根（run 31098998980）：跨境到腾讯云 COS 的预签名 URL 有效窗口短，2.6MB 在
        # ~10KB/s 下要传 ~270s，常在收尾时被 COS 以 400 拒（连接被重置/签名失效）。原实现
        # `curl --retry 4` 复用**同一个**预签名 URL，一旦它失效，4 次重试注定全部 400，日志里
        # 连续两条 curl (22) 400 后被取消。
        # 修复：每次尝试**重新拉取**预签名 URL 再上传（失效 URL 不再连累后续重试），并加停滞
        # 检测（<1KB/s 持续 30s 视为死连接，立即放弃并换新 URL 重试，而不是骑满整个窗口）。
        # 失败保护：新版本创建/构建/启动失败时不会进入灰度流程，旧版本继续承接。
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sbh-source.zip"
          upload_info="$RUNNER_TEMP/sbh-upload.json"
          deploy_info="$RUNNER_TEMP/sbh-deploy.json"

          # 包体积是这条通道的命门：跨境传到腾讯云 COS，包越大越容易在签名窗口内传不完。
          # payload-office-platform/.gitattributes 用 export-ignore 把 tests/
          # 与 src/migrations/*.json 快照（仅 migrate:create 用，运行时不读）挡在包外。
          # 这里加硬阈值：再有大文件混进来立刻失败，而不是耗十几分钟超时后才暴露。
          git archive --format=zip HEAD:payload-office-platform > "$archive"
          archive_bytes=$(wc -c < "$archive")
          echo "代码包体积：$archive_bytes bytes"
          if [ "$archive_bytes" -gt 3145728 ]; then
            echo "::error::代码包 $archive_bytes bytes 超过 3MB 阈值，跨境上传大概率超时。"
            echo "::error::检查是否有构建产物/截图/大文件进了仓库，按需加进 .gitattributes 的 export-ignore。"
            exit 1
          fi

          # 每次调用都会分配新的 PackageName/PackageVersion 与配套预签名 URL；上传成功后
          # 必须用**同一次**调用返回的包名/版本提交部署（$upload_info 即当前成功那次）。
          # tcb api 无内置超时，包 timeout 防挂死拖满整个 job。
          fetch_upload_info() {
            local body
            body=$(jq -cn --arg envId "$TCB_ENV_ID" '{EnvId:$envId,ServiceName:"sbh"}')
            timeout 60 tcb api tcb DescribeCloudBaseBuildService \
              --api-version 2018-06-08 \
              --json \
              --body "$body" |
              sed -n '/^{/,$p' > "$upload_info"
            jq -e '.data.UploadUrl and .data.PackageName and .data.PackageVersion' "$upload_info" >/dev/null
          }

          uploaded=0
          for attempt in 1 2 3 4; do
            echo "== 上传尝试 $attempt/4：拉取新预签名 URL =="
            fetch_upload_info
            upload_url=$(jq -r '.data.UploadUrl' "$upload_info")
            curl_headers=()
            while IFS=$'\t' read -r key value; do
              if [ -n "$key" ]; then
                curl_headers+=(--header "$key: $value")
              fi
            done < <(jq -r '.data.UploadHeaders[]? | [.Key,.Value] | @tsv' "$upload_info")
            # --max-time 300：给进行中的慢传留够收尾时间；--speed-limit/--speed-time：
            # 只杀真正停滞的死连接，不误伤稳定慢传。
            if curl \
              --http1.1 \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 300 \
              --speed-limit 1024 \
              --speed-time 30 \
              --upload-file "$archive" \
              "${curl_headers[@]}" \
              "$upload_url"; then
              uploaded=1
              echo "== 上传成功（尝试 $attempt）=="
              break
            fi
            echo "::warning::上传尝试 $attempt 失败，3s 后换新 URL 重试"
            sleep 3
          done
          if [ "$uploaded" != "1" ]; then
            echo "::error::4 次上传全部失败"
            exit 1
          fi

          package_name=$(jq -r '.data.PackageName' "$upload_info")
          package_version=$(jq -r '.data.PackageVersion' "$upload_info")
          deploy_body=$(jq -cn \
            --arg envId "$TCB_ENV_ID" \
            --arg packageName "$package_name" \
            --arg packageVersion "$package_version" \
            '{
              EnvId:$envId,
              ServerName:"sbh",
              DeployInfo:{
                DeployType:"package",
                PackageName:$packageName,
                PackageVersion:$packageVersion,
                ReleaseType: "GRAY"
              },
              Items:[
                {Key:"AccessTypes",ArrayValue:["OA","PUBLIC","MINIAPP"]},
                {Key:"Port",IntValue:80}
              ]
            }')
          timeout 60 tcb api tcbr UpdateCloudRunServer \
            --api-version 2022-02-17 \
            --json \
            --body "$deploy_body" |
            sed -n '/^{/,$p' > "$deploy_info"
          jq -e '.data.TaskId | numbers' "$deploy_info" >/dev/null

      - name: 等待新版本就绪 + 切 10% 灰度
        if: ${{ false }}
        # 轮询部署记录，只有镜像构建、迁移、容器探针全部正常后才切流。
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          set -euo pipefail
          deploy_info="$RUNNER_TEMP/sbh-deploy.json"
          task_info="$RUNNER_TEMP/sbh-task.json"
          records_info="$RUNNER_TEMP/sbh-records.json"
          task_id=$(jq -r '.data.TaskId' "$deploy_info")
          ready=0

          for attempt in $(seq 1 80); do
            task_body=$(jq -cn \
              --arg envId "$TCB_ENV_ID" \
              --argjson taskId "$task_id" \
              '{EnvId:$envId,ServerName:"sbh",TaskId:$taskId}')
            tcb api tcbr DescribeServerManageTask \
              --api-version 2022-02-17 \
              --json \
              --body "$task_body" |
              sed -n '/^{/,$p' > "$task_info"
            version_name=$(jq -r '.data.Task.VersionName // empty' "$task_info")

            if [ -z "$version_name" ]; then
              echo "[$attempt/80] 等待平台分配版本号"
              sleep 15
              continue
            fi

            records_body=$(jq -cn --arg envId "$TCB_ENV_ID" \
              '{EnvId:$envId,ServerName:"sbh"}')
            tcb api tcbr DescribeCloudRunDeployRecord \
              --api-version 2022-02-17 \
              --json \
              --body "$records_body" |
              sed -n '/^{/,$p' > "$records_info"
            deploy_id="${version_name##*-}"
            deploy_status=$(jq -r --arg deployId "$deploy_id" \
              '.data.DeployRecords[] |
                select(.DeployId == $deployId) |
                .Status' "$records_info")
            echo "[$attempt/80] $version_name -> $deploy_status"

            case "$deploy_status" in
              normal)
                ready=1
                break
                ;;
              build_failed|deploy_failed)
                echo "::error::$version_name 部署失败：$deploy_status"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          if [ "$ready" != "1" ]; then
            echo "::error::等待新版本就绪超时"
            exit 1
          fi

          tcb -e "${{ secrets.TCB_ENV_ID }}" cloudrun traffic \
            -s sbh \
            --stable 90 \
            --canary 10

      - name: Smoke test after image deploy
        id: smoke
        run: |
          URL="https://sbh-286300-10-1253925058.sh.run.tcloudbase.com"
          healthy=0
          for i in $(seq 1 12); do
            body_file="$RUNNER_TEMP/health-$i.json"
            code=$(curl -sS --max-time 15 -o "$body_file" -w "%{http_code}" "$URL/api/health")
            echo "[$i] GET /api/health -> HTTP $code"
            if [ "$code" = "200" ] && jq -e '.status == "ok"' "$body_file" >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          if [ "$healthy" != "1" ]; then
            echo "::error::Health check failed after image deploy"
            exit 1
          fi
          home=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" "$URL/")
          echo "GET / -> HTTP $home"
          if [ "$home" != "200" ]; then
            echo "::error::Homepage check failed after image deploy"
            exit 1
          fi
          echo "Image deploy smoke passed"
      - name: 全量发布后验证
        if: success()
        run: |
          URL="https://sbh-286300-10-1253925058.sh.run.tcloudbase.com"
          health=$(curl -sS --max-time 15 "$URL/api/health")
          echo "$health" | jq -e '.status == "ok"' >/dev/null
          for path in / /admin; do
            code=$(curl -sS --max-time 15 -o /dev/null -w "%{http_code}" "$URL$path")
            echo "GET $path -> HTTP $code"
            test "$code" = "200"
          done

      - name: Rollback（冒烟或 promote 失败时切回稳定版本）
        if: failure()
        run: |
          echo "::error::发布失败，回滚流量到稳定版本"
          tcb -e "${{ secrets.TCB_ENV_ID }}" cloudrun traffic rollback -s sbh || true
          exit 1

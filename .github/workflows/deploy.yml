# Git 自动部署 -> CloudBase CloudRun
#
# 触发：push 到 master 且改动 payload-office-platform/ 或本 workflow 文件；
#       也可在 Actions 页面手动触发 (workflow_dispatch)。
#
# 两段式（OPT-016）：
#   quality  - 在 CI runner 上跑 lint/typecheck/test/build/迁移预检，作为发布质量门。
#              失败则 deploy 不跑。产物不传递（deploy 重新 checkout 干净源码）。
#   deploy   - 锁定 @cloudbase/cli@3.6.4；部署新版本（灰度 0% 流量）。
#              **默认到此为止**：自动触发（master 合并）只提交 GRAY 版本，不碰线上流量。
#              放量需在 Actions 页面手动触发本工作流并勾选 promote，届时才走
#              切 10% 灰度 -> 冒烟（/api/health + /）-> traffic promote 全量，
#              失败则 traffic rollback。
#
# 机制：用 CloudBase 官方 API 分配上传地址，带重试上传 ZIP，再显式提交 GRAY 版本。
#       避免 CloudBase CLI 单次上传遇到 ECONNRESET 后直接失败。
#       平台在线 docker build 并发布新版本。
#       CI 端不装项目依赖、不构建--构建在平台发生（quality job 的 build 仅作质量门，
#       产物留在 quality runner，不进 ZIP）。
#
# 迁移单次执行：容器启动时跑 scripts/migrate-locked.ts（PG advisory lock 互斥 + 幂等），
#       多实例并发拉起只有一个实例真正跑迁移。CI 不单独跑迁移。
#
# 鉴权：腾讯云 CAM 子账号 API 密钥 (SecretId/SecretKey)，tcb login --apiKeyId/--apiKey。
#       子账号需绑定 CAM 策略：
#         - QcloudAccessForTCBRole
#         - QcloudAccessForTCBRoleInAccessCloudBaseRun
#       密钥注入到 GitHub Secrets：TCB_SECRET_ID / TCB_SECRET_KEY / TCB_ENV_ID
#
# 环境变量：发布请求不传 env-vars，继续使用服务级环境变量
#       (DATABASE_URL / PAYLOAD_SECRET / NODE_ENV) 已在控制台/MCP 配好，
#       代码部署只更新版本，不清空服务配置。无需每次重传。
#       首次跑 CI 后建议到控制台核对环境变量仍在。

name: Deploy to CloudBase CloudRun

# 触发方式：由 quality.yml 跑完且**整体成功**后接力，不再自己监听 push。
#
# 两个目的：
#   1. 省额度：原先本文件的 quality 作业把 quality.yml 刚做过的 lint / typecheck /
#      test / build 在同一个 commit 上又跑一遍（实测 4m39s），纯重复。
#   2. 堵洞：原先部署只被本文件内的质量门挡住，**挡不住 e2e**（e2e 在 quality.yml 里）。
#      真实教训：PR #50 合入后 19 条 e2e 全红，部署照样绿灯上线。改为依赖 quality.yml
#      整体结论后，e2e 红 → 不部署。
#
# 注意：quality.yml 的 paths 里必须包含本文件，否则只改 deploy.yml 时上游不触发、
# 部署链路会静默失联。
on:
  workflow_run:
    workflows: ['Quality and migration baseline']
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      promote:
        description: '切流量到新版本（不勾选＝只部署 GRAY 版本、0% 流量，线上保持当前版本）'
        type: boolean
        required: false
        default: false

# 部署互相排队，不中途取消（避免并发发布互相覆盖版本）
concurrency:
  group: deploy-sbh
  cancel-in-progress: false

jobs:
  # ---------- 部署：灰度 -> 冒烟 -> 全量/回滚 ----------
  # 质量门不在本文件里：lint / typecheck / test / build / 迁移预检 / e2e 全部由
  # quality.yml 覆盖，本工作流只在它整体成功后才被触发（见顶部 on.workflow_run）。
  deploy:
    # workflow_run 在上游失败/取消时同样会触发（types: [completed]），必须自行判定结论；
    # 手动 workflow_dispatch 走人工确认，不受此限。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 非交互模式：所有确认提示（telemetry 询问、--force 确认）自动按默认值走。
      # 否则 CI 无 tty，提示库收到 EOF 会以 exit 130 中断。
      CLOUDBASE_CI: '1'
      # 是否把流量切到新版本。
      #
      # 默认 false，且**自动触发（workflow_run）一律为 false**：合并到 master 只会
      # 构建并提交 GRAY 版本（0% 流量），线上继续由当前稳定版本承接。放量是显式动作，
      # 需要在 Actions 页面手动触发本工作流并勾选 promote。
      #
      # 这样默认路径是安全的：新版本进了环境、可以单独验证，但不影响线上流量。
      SHOULD_PROMOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.promote }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run 触发时 checkout 默认取默认分支最新提交，而不是触发它的那个
          # commit —— 若期间又推了一次 master，部署的就不是刚过闸门的代码。下面的
          # `git archive HEAD` 直接决定发布内容，因此必须显式钉到上游 run 的 head_sha。
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CloudBase CLI（锁版本，避免 @latest 漂移破坏命令语义）
        run: npm install -g @cloudbase/cli@3.6.4

      - name: tcb login (CAM API key)
        run: tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"

      - name: 上传代码包并提交灰度版本（初始 0% 流量）
        # 病根（run 31098998980）：跨境到腾讯云 COS 的预签名 URL 有效窗口短，2.6MB 在
        # ~10KB/s 下要传 ~270s，常在收尾时被 COS 以 400 拒（连接被重置/签名失效）。原实现
        # `curl --retry 4` 复用**同一个**预签名 URL，一旦它失效，4 次重试注定全部 400，日志里
        # 连续两条 curl (22) 400 后被取消。
        # 修复：每次尝试**重新拉取**预签名 URL 再上传（失效 URL 不再连累后续重试），并加停滞
        # 检测（<1KB/s 持续 30s 视为死连接，立即放弃并换新 URL 重试，而不是骑满整个窗口）。
        # 失败保护：新版本创建/构建/启动失败时不会进入灰度流程，旧版本继续承接。
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/sbh-source.zip"
          upload_info="$RUNNER_TEMP/sbh-upload.json"
          deploy_info="$RUNNER_TEMP/sbh-deploy.json"

          # 包体积是这条通道的命门：跨境传到腾讯云 COS，包越大越容易在签名窗口内传不完。
          # payload-office-platform/.gitattributes 用 export-ignore 把 tests/
          # 与 src/migrations/*.json 快照（仅 migrate:create 用，运行时不读）挡在包外。
          # 这里加硬阈值：再有大文件混进来立刻失败，而不是耗十几分钟超时后才暴露。
          git archive --format=zip HEAD:payload-office-platform > "$archive"

          # 把本次 commit 注入包内：镜像由平台在线构建，CI 传不了 --build-arg，
          # 只能走代码包。next.config.ts 在构建期把它内联进产物，/api/health 回显
          # version，冒烟据此判断"新版本确实在承接流量"而不只是"域名还活着"。
          # 病根 run 31275171164：报 success 但线上版本没变——冒烟打生产域名，流量还在
          # 旧版本上，旧版本健康所以必然通过，假成功掩盖了后续 7 次真失败。
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > "$RUNNER_TEMP/build-info.json"
          (cd "$RUNNER_TEMP" && zip -q "$archive" build-info.json)

          archive_bytes=$(wc -c < "$archive")
          echo "代码包体积：$archive_bytes bytes"
          if [ "$archive_bytes" -gt 3145728 ]; then
            echo "::error::代码包 $archive_bytes bytes 超过 3MB 阈值，跨境上传大概率超时。"
            echo "::error::检查是否有构建产物/截图/大文件进了仓库，按需加进 .gitattributes 的 export-ignore。"
            exit 1
          fi

          # 每次调用都会分配新的 PackageName/PackageVersion 与配套预签名 URL；上传成功后
          # 必须用**同一次**调用返回的包名/版本提交部署（$upload_info 即当前成功那次）。
          # tcb api 无内置超时，包 timeout 防挂死拖满整个 job。
          fetch_upload_info() {
            local body
            body=$(jq -cn --arg envId "$TCB_ENV_ID" '{EnvId:$envId,ServiceName:"sbh"}')
            timeout 60 tcb api tcb DescribeCloudBaseBuildService \
              --api-version 2018-06-08 \
              --json \
              --body "$body" |
              sed -n '/^{/,$p' > "$upload_info"
            jq -e '.data.UploadUrl and .data.PackageName and .data.PackageVersion' "$upload_info" >/dev/null
          }

          uploaded=0
          for attempt in 1 2 3 4; do
            echo "== 上传尝试 $attempt/4：拉取新预签名 URL =="
            fetch_upload_info
            upload_url=$(jq -r '.data.UploadUrl' "$upload_info")
            curl_headers=()
            while IFS=$'\t' read -r key value; do
              if [ -n "$key" ]; then
                curl_headers+=(--header "$key: $value")
              fi
            done < <(jq -r '.data.UploadHeaders[]? | [.Key,.Value] | @tsv' "$upload_info")
            # --max-time 300：给进行中的慢传留够收尾时间；--speed-limit/--speed-time：
            # 只杀真正停滞的死连接，不误伤稳定慢传。
            if curl \
              --http1.1 \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 20 \
              --max-time 300 \
              --speed-limit 1024 \
              --speed-time 30 \
              --upload-file "$archive" \
              "${curl_headers[@]}" \
              "$upload_url"; then
              uploaded=1
              echo "== 上传成功（尝试 $attempt）=="
              break
            fi
            echo "::warning::上传尝试 $attempt 失败，3s 后换新 URL 重试"
            sleep 3
          done
          if [ "$uploaded" != "1" ]; then
            echo "::error::4 次上传全部失败"
            exit 1
          fi

          package_name=$(jq -r '.data.PackageName' "$upload_info")
          package_version=$(jq -r '.data.PackageVersion' "$upload_info")
          deploy_body=$(jq -cn \
            --arg envId "$TCB_ENV_ID" \
            --arg packageName "$package_name" \
            --arg packageVersion "$package_version" \
            '{
              EnvId:$envId,
              ServerName:"sbh",
              DeployInfo:{
                DeployType:"package",
                PackageName:$packageName,
                PackageVersion:$packageVersion,
                ReleaseType: "GRAY"
              },
              Items:[
                {Key:"AccessTypes",ArrayValue:["OA","PUBLIC","MINIAPP"]},
                {Key:"Port",IntValue:80}
              ]
            }')
          timeout 60 tcb api tcbr UpdateCloudRunServer \
            --api-version 2022-02-17 \
            --json \
            --body "$deploy_body" |
            sed -n '/^{/,$p' > "$deploy_info"
          jq -e '.data.TaskId | numbers' "$deploy_info" >/dev/null

      - name: 等待新版本构建就绪（始终执行，不切流量）
        # 刻意**没有** SHOULD_PROMOTE 门：不切流量的部署同样要知道构建成没成。
        #
        # 病根（sbh-096 / run 32119795967）：提交步骤只用 jq -e '.data.TaskId' 确认接口
        # 受理，而真正判构建结果的轮询挂在 SHOULD_PROMOTE 上——push 触发时整步跳过，于是
        # CloudBase 侧 build_failed、GitHub 侧却报 success。没人会去复查一次「成功」的
        # 部署，失败就这么静默了。
        #
        # 现在轮询无条件执行：构建失败 / 超时一律让 job 红。切流量是可选动作，拆到下一步。
        # 轮询部署记录，只有镜像构建、迁移、容器探针全部正常后才切流。
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          set -euo pipefail
          deploy_info="$RUNNER_TEMP/sbh-deploy.json"
          task_info="$RUNNER_TEMP/sbh-task.json"
          records_info="$RUNNER_TEMP/sbh-records.json"
          task_id=$(jq -r '.data.TaskId' "$deploy_info")
          ready=0

          for attempt in $(seq 1 80); do
            task_body=$(jq -cn \
              --arg envId "$TCB_ENV_ID" \
              --argjson taskId "$task_id" \
              '{EnvId:$envId,ServerName:"sbh",TaskId:$taskId}')
            tcb api tcbr DescribeServerManageTask \
              --api-version 2022-02-17 \
              --json \
              --body "$task_body" |
              sed -n '/^{/,$p' > "$task_info"
            version_name=$(jq -r '.data.Task.VersionName // empty' "$task_info")

            if [ -z "$version_name" ]; then
              echo "[$attempt/80] 等待平台分配版本号"
              sleep 15
              continue
            fi

            records_body=$(jq -cn --arg envId "$TCB_ENV_ID" \
              '{EnvId:$envId,ServerName:"sbh"}')
            tcb api tcbr DescribeCloudRunDeployRecord \
              --api-version 2022-02-17 \
              --json \
              --body "$records_body" |
              sed -n '/^{/,$p' > "$records_info"
            deploy_id="${version_name##*-}"
            deploy_status=$(jq -r --arg deployId "$deploy_id" \
              '.data.DeployRecords[] |
                select(.DeployId == $deployId) |
                .Status' "$records_info")
            echo "[$attempt/80] $version_name -> $deploy_status"

            case "$deploy_status" in
              normal)
                ready=1
                break
                ;;
              build_failed|deploy_failed)
                echo "::error::$version_name 部署失败：$deploy_status"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          if [ "$ready" != "1" ]; then
            echo "::error::等待新版本就绪超时"
            exit 1
          fi

      - name: 切 10% 灰度
        if: env.SHOULD_PROMOTE == 'true'
        run: |
          set -euo pipefail
          tcb -e "${{ secrets.TCB_ENV_ID }}" cloudrun traffic \
            -s sbh \
            --stable 90 \
            --canary 10

      - name: Smoke test（灰度版本健康检查）
        if: env.SHOULD_PROMOTE == 'true'
        id: smoke
        run: |
          # 灰度 10% 期间多次请求，提高命中新版本概率；
          # 同时验证整体服务可用（旧版本不被新版本部署影响）。
          #
          # canary_ok 必须靠 version 字段认人：只看 status == "ok" 无法区分新旧版本，
          # 旧版本同样返回 ok。run 31275171164 就是这么报出假 success 的——线上版本
          # 压根没变，而冒烟"通过"了，后续 7 次真失败因此被掩盖。
          URL="https://sbh-286300-10-1253925058.sh.run.tcloudbase.com"
          expected="$GITHUB_SHA"
          echo "期望灰度版本 version=$expected"
          fail=0
          canary_ok=0
          for i in $(seq 1 50); do
            body_file="$RUNNER_TEMP/health-$i.json"
            code=$(curl -sS --max-time 15 -o "$body_file" -w "%{http_code}" "$URL/api/health")
            if [ "$code" = "200" ]; then
              if jq -e '.status == "ok"' "$body_file" >/dev/null; then
                version=$(jq -r '.version // ""' "$body_file")
                if [ "$version" = "$expected" ]; then
                  canary_ok=$((canary_ok + 1))
                  echo "[$i] HTTP 200 version=$version ← 命中灰度版本"
                else
                  # 命中稳定旧版本是灰度期的正常情况，不算失败。
                  echo "[$i] HTTP 200 version=$version（旧版本）"
                fi
              else
                echo "[$i] HTTP 200 但 status != ok"
                fail=1
              fi
              continue
            fi
            echo "[$i] GET /api/health -> HTTP $code"
            # 稳定版本 sbh-007 尚无该路由；灰度期间命中旧版本的 404 可接受。
            if [ "$code" = "404" ]; then
              continue
            fi
            fail=1
          done
          # 这里不把"没命中灰度版本"判为失败——实测（run 31300263780）切流命令回显
          # canary 10/stable 90 成功，紧接着 50 次请求仍 0 命中。真是 10% 的话 0/50 概率
          # 约 0.5%，不是运气问题。两个已知成因：
          #   1. 切流后路由需要时间收敛。仓库自己的 scripts/cloudrun-release.sh 就带
          #      wait_traffic 助手和"流量在 60 秒内未收敛"的报错，deploy.yml 却没有等待。
          #   2. 50 次请求都来自同一个 runner IP，可能被粘在同一后端。
          # 结论：灰度期"一定能命中新版本"这个前提不成立，拿它当硬门槛会误杀正常发布。
          # 真正的门槛放在 promote 之后——那时 100% 流量都是新版本，判定确定无疑。
          if [ "$canary_ok" -lt 1 ]; then
            echo "::notice::50 次请求未命中 version=$expected 的灰度版本（可能是路由未收敛或同 IP 粘连）"
            echo "::notice::不阻断发布；是否真正上线由 promote 之后的版本校验判定"
          fi
          echo "命中灰度版本 $canary_ok/50 次"
          # 首页可达（跟随重定向后 200，支持单城市模式与多城市路由重定向）
          home=$(curl -sSL -o /dev/null -w "%{http_code}" "$URL/")
          echo "GET / -> HTTP $home"
          if [ "$home" != "200" ]; then fail=1; fi
          if [ "$fail" = "1" ]; then
            echo "::error::冒烟失败，将触发回滚"
            exit 1
          fi
          echo "✅ 冒烟通过"

      - name: Promote 全量发布
        if: success() && env.SHOULD_PROMOTE == 'true'
        run: |
          tcb -e "${{ secrets.TCB_ENV_ID }}" cloudrun traffic promote -s sbh
          echo "✅ 全量发布完成"

      - name: 全量发布后验证
        if: success() && env.SHOULD_PROMOTE == 'true'
        run: |
          URL="https://sbh-286300-10-1253925058.sh.run.tcloudbase.com"
          health=$(curl -sS --max-time 15 "$URL/api/health")
          echo "$health" | jq -e '.status == "ok"' >/dev/null

          # 这是整条流水线唯一的硬门槛，也是堵死"假成功"的地方。
          # promote 后 100% 流量都是新版本，判定确定无疑——不像灰度期那样受路由收敛
          # 与同 IP 粘连影响（run 31300263780 实测灰度 0/50 命中，见冒烟步骤注释）。
          # 光看 status == ok 通不过这一关：旧版本同样返回 ok，run 31275171164 的假
          # success 正是这么来的。
          expected="$GITHUB_SHA"
          matched=0
          # 切流后允许收敛：最多等 100 秒，出现 3 次连续匹配才算数（防抖动误判）。
          for i in $(seq 1 20); do
            version=$(curl -sS --max-time 15 "$URL/api/health" | jq -r '.version // ""')
            if [ "$version" = "$expected" ]; then
              matched=$((matched + 1))
              echo "[$i] version=$version ✓（连续匹配 $matched/3）"
              if [ "$matched" -ge 3 ]; then break; fi
            else
              # version 为空 = 旧版本（早于本机制，无该字段）；unknown = 注入或内联失效。
              matched=0
              echo "[$i] version=${version:-<无该字段/旧版本>} 尚未收敛"
            fi
            sleep 5
          done
          if [ "$matched" -lt 3 ]; then
            echo "::error::promote 后线上版本始终不是 $expected —— 全量发布未生效，触发回滚"
            echo "::error::若持续为 unknown，说明 build-info.json 注入或构建期内联失效"
            exit 1
          fi
          echo "✅ 全量流量已是本次版本 $expected"

          for path in / /shanghai /admin; do
            code=$(curl -sSL --max-time 15 -o /dev/null -w "%{http_code}" "$URL$path")
            echo "GET $path -> HTTP $code"
            test "$code" = "200"
          done

      - name: Rollback（冒烟或 promote 失败时切回稳定版本）
        # 未放量时无需回滚：流量从未离开稳定版本，GRAY 版本自身失败不影响线上
        if: failure() && env.SHOULD_PROMOTE == 'true'
        run: |
          echo "::error::发布失败，回滚流量到稳定版本"
          tcb -e "${{ secrets.TCB_ENV_ID }}" cloudrun traffic rollback -s sbh || true
          exit 1

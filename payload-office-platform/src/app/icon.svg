<!-- 商办租赁 · 站点图标（OPT-065）
     底色取自 (frontend)/styles.css 的 accent token #0071e3，塔楼 #ffffff。
     本文件是三份图标资产（icon.svg / favicon.ico / apple-icon.png）的唯一事实源，
     改完跑 `pnpm icons:build` 重新生成另外两份，别手工改二进制。
     几何按 512 网格：三段错落塔楼 + 楼层横缝。横缝在 16px 下会糊掉、只剩塔楼
     轮廓，这是刻意的：小尺寸靠轮廓识别，不靠细节。
     注意 XML 注释里不能出现连续两个减号，写 CSS 自定义属性名时避开。 -->
